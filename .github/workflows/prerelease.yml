name: Publish qualified Mongoose release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing qualified release tag to publish (never moved)
        required: true
        type: string
      expected_sha:
        description: Full qualified commit SHA; must match the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify exact release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess, xml.etree.ElementTree as ET
          version = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-rc\d+)?', version), version
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag/POM mismatch'
          expected = os.environ.get('EXPECTED_SHA', '')
          if expected:
              assert re.fullmatch(r'[0-9a-f]{40}', expected), 'full commit SHA required'
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected, 'tag/SHA mismatch'
          PYTHON
          git log -1 --format='%H %s'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: repsy-fluxtion
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Explicit dispatch only: local releases must not also publish from a tag push.
      # Do not enable the legacy Central release profile for Repsy publication.
      - name: Publish the tagged version to Repsy
        run: mvn -B -ntp -Dmaven.test.redirectTestOutputToFile=true -DaltDeploymentRepository=repsy-fluxtion::https://repo.repsy.io/mvn/fluxtion/fluxtion-public clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.REPSY_USER }}
          MAVEN_PASSWORD: ${{ secrets.REPSY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerelease-test-reports
          path: |
            target/surefire-reports/
