<svg xmlns="http://www.w3.org/2000/svg" class="mg-architecture" viewBox="0 0 1080 758" role="img" aria-labelledby="eventdeliveryTitle eventdeliveryDesc">
<title id="eventdeliveryTitle">Deliver an application event</title><desc id="eventdeliveryDesc">Successful feed delivery. A group reader can invoke several subscribed processors.</desc>
<style>
.mg-architecture { --bg:#f5f8fc; --panel:#ffffff; --text:#17283d; --muted:#526379; --line:#64748b; --border:#ced8e5; --accent:#165cba; --soft:#e8f0fc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); border:1px solid var(--border); border-radius:16px; width:100%; height:auto; }
@media(prefers-color-scheme:dark){.mg-architecture {--bg:#152032;--panel:#1c2c42;--text:#edf4ff;--muted:#b6c7dc;--line:#91aac8;--border:#3c516e;--accent:#8abaff;--soft:#253d5d}}
[data-md-color-scheme="default"] .mg-architecture {--bg:#f5f8fc;--panel:#fff;--text:#17283d;--muted:#526379;--line:#64748b;--border:#ced8e5;--accent:#165cba;--soft:#e8f0fc}
[data-md-color-scheme="slate"] .mg-architecture {--bg:#152032;--panel:#1c2c42;--text:#edf4ff;--muted:#b6c7dc;--line:#91aac8;--border:#3c516e;--accent:#8abaff;--soft:#253d5d}
.mg-architecture text{fill:var(--text);font-size:16px}.mg-architecture .heading{font-size:25px;font-weight:650}.mg-architecture .label{font-size:17px;font-weight:650}.mg-architecture .small{font-size:14px;fill:var(--muted)}.mg-architecture .eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;fill:var(--accent)}.mg-architecture .card{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.mg-architecture .band{fill:var(--soft);stroke:var(--border)}.mg-architecture .wire{fill:none;stroke:var(--line);stroke-width:1.7}.mg-architecture .life{stroke:var(--border);stroke-width:1.4;stroke-dasharray:5 6}
</style>
<defs><marker id="eventdeliveryArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="var(--line)"/></marker></defs>
<text x="32" y="35" class="eyebrow" text-anchor="start">MONGOOSE / RUNTIME ARCHITECTURE</text>
<text x="32" y="72" class="heading" text-anchor="start">Deliver an application event</text>
<text x="32" y="101" class="small" text-anchor="start">Successful feed delivery. A group reader can invoke several subscribed processors.</text>
<rect class="band" x="15.0" y="130" width="200" height="56" rx="10"/>
<text x="115.0" y="164" class="label" text-anchor="middle">Feed thread</text>
<path class="life" d="M115.0,186 V693"/>
<rect class="band" x="298.3333333333333" y="130" width="200" height="56" rx="10"/>
<text x="398.3333333333333" y="164" class="label" text-anchor="middle">Publisher</text>
<path class="life" d="M398.3333333333333,186 V693"/>
<rect class="band" x="581.6666666666666" y="130" width="200" height="56" rx="10"/>
<text x="681.6666666666666" y="164" class="label" text-anchor="middle">Dispatch queue</text>
<path class="life" d="M681.6666666666666,186 V693"/>
<rect class="band" x="865.0" y="130" width="200" height="56" rx="10"/>
<text x="965.0" y="164" class="label" text-anchor="middle">Group thread</text>
<path class="life" d="M965.0,186 V693"/>
<path class="wire" d="M115.0,225 L398.3333333333333,225" marker-end="url(#eventdeliveryArrow)"/>
<text x="256.66666666666663" y="215" class="small" text-anchor="middle">1. Publish input; transfer origin ownership</text>
<rect class="card" x="303.3333333333333" y="269" width="190" height="38" rx="8"/>
<text x="398.3333333333333" y="293" class="small" text-anchor="middle">Map / wrap</text>
<path class="wire" d="M398.3333333333333,357 L681.6666666666666,357" marker-end="url(#eventdeliveryArrow)"/>
<text x="540.0" y="347" class="small" text-anchor="middle">3. Offer under publisher lock</text>
<rect class="card" x="303.3333333333333" y="401" width="190" height="38" rx="8"/>
<text x="398.3333333333333" y="425" class="small" text-anchor="middle">Release origin</text>
<path class="wire" d="M965.0,489 L681.6666666666666,489" marker-end="url(#eventdeliveryArrow)"/>
<text x="823.3333333333333" y="479" class="small" text-anchor="middle">5. Poll queued item</text>
<path class="wire" d="M681.6666666666666,555 L965.0,555" marker-end="url(#eventdeliveryArrow)"/>
<text x="823.3333333333333" y="545" class="small" text-anchor="middle">6. Deliver through invocation strategy</text>
<rect class="card" x="870.0" y="599" width="190" height="38" rx="8"/>
<text x="965.0" y="623" class="small" text-anchor="middle">Invoke subscribers</text>
<rect class="card" x="870.0" y="665" width="190" height="38" rx="8"/>
<text x="965.0" y="689" class="small" text-anchor="middle">Release queue reference</text>
<text x="32" y="734" class="small" text-anchor="start">Control work is checked before readers run. Callback time, retries and audit costs belong to the group.</text>
</svg>
