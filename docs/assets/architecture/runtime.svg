<svg xmlns="http://www.w3.org/2000/svg" class="mg-architecture" viewBox="0 0 1080 690" role="img" aria-labelledby="runtimeTitle runtimeDesc">
<title id="runtimeTitle">Two event paths, one owner per group</title><desc id="runtimeDesc">Business events and lifecycle commands share a thread, but have separate dispatch paths.</desc>
<style>
.mg-architecture { --bg:#f5f8fc; --panel:#ffffff; --text:#17283d; --muted:#526379; --line:#64748b; --border:#ced8e5; --accent:#165cba; --soft:#e8f0fc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); border:1px solid var(--border); border-radius:16px; width:100%; height:auto; }
@media(prefers-color-scheme:dark){.mg-architecture {--bg:#152032;--panel:#1c2c42;--text:#edf4ff;--muted:#b6c7dc;--line:#91aac8;--border:#3c516e;--accent:#8abaff;--soft:#253d5d}}
[data-md-color-scheme="default"] .mg-architecture {--bg:#f5f8fc;--panel:#fff;--text:#17283d;--muted:#526379;--line:#64748b;--border:#ced8e5;--accent:#165cba;--soft:#e8f0fc}
[data-md-color-scheme="slate"] .mg-architecture {--bg:#152032;--panel:#1c2c42;--text:#edf4ff;--muted:#b6c7dc;--line:#91aac8;--border:#3c516e;--accent:#8abaff;--soft:#253d5d}
.mg-architecture text{fill:var(--text);font-size:16px}.mg-architecture .heading{font-size:25px;font-weight:650}.mg-architecture .label{font-size:17px;font-weight:650}.mg-architecture .small{font-size:14px;fill:var(--muted)}.mg-architecture .eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;fill:var(--accent)}.mg-architecture .card{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.mg-architecture .band{fill:var(--soft);stroke:var(--border)}.mg-architecture .wire{fill:none;stroke:var(--line);stroke-width:1.7}.mg-architecture .life{stroke:var(--border);stroke-width:1.4;stroke-dasharray:5 6}
</style>
<defs><marker id="runtimeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="var(--line)"/></marker></defs>
<text x="32" y="35" class="eyebrow" text-anchor="start">MONGOOSE / RUNTIME ARCHITECTURE</text>
<text x="32" y="72" class="heading" text-anchor="start">Two event paths, one owner per group</text>
<text x="32" y="101" class="small" text-anchor="start">Business events and lifecycle commands share a thread, but have separate dispatch paths.</text>
<rect class="card" x="30" y="140" width="270" height="108" rx="12"/>
<text x="48" y="170" class="label" text-anchor="start">Feeds and external callbacks</text>
<text x="48" y="196" class="small" text-anchor="start">Source or service thread</text>
<text x="48" y="219" class="small" text-anchor="start">Map / wrap / publish</text>
<rect class="card" x="405" y="140" width="275" height="108" rx="12"/>
<text x="423" y="170" class="label" text-anchor="start">Application queues</text>
<text x="423" y="196" class="small" text-anchor="start">Serialized publisher writes</text>
<text x="423" y="219" class="small" text-anchor="start">Single consumer: the group</text>
<rect class="card" x="780" y="140" width="270" height="108" rx="12"/>
<text x="798" y="170" class="label" text-anchor="start">Business processors</text>
<text x="798" y="196" class="small" text-anchor="start">Handlers, timers, admin events</text>
<text x="798" y="219" class="small" text-anchor="start">Application state and outputs</text>
<path class="wire" d="M300,195 L405,195" marker-end="url(#runtimeArrow)"/>
<path class="wire" d="M680,195 L780,195" marker-end="url(#runtimeArrow)"/>
<rect class="card" x="30" y="345" width="270" height="108" rx="12"/>
<text x="48" y="375" class="label" text-anchor="start">API and server admission</text>
<text x="48" y="401" class="small" text-anchor="start">Add / stop / service / capture</text>
<text x="48" y="424" class="small" text-anchor="start">Reserve name and fence shutdown</text>
<rect class="card" x="405" y="345" width="275" height="108" rx="12"/>
<text x="423" y="375" class="label" text-anchor="start">Control mailbox</text>
<text x="423" y="401" class="small" text-anchor="start">Commands in publication order</text>
<text x="423" y="424" class="small" text-anchor="start">Separate completion queue</text>
<rect class="card" x="780" y="345" width="270" height="108" rx="12"/>
<text x="798" y="375" class="label" text-anchor="start">Fluxtion control processor</text>
<text x="798" y="401" class="small" text-anchor="start">Decide → record → effect</text>
<text x="798" y="424" class="small" text-anchor="start">Results return as event cycles</text>
<path class="wire" d="M300,400 L405,400" marker-end="url(#runtimeArrow)"/>
<path class="wire" d="M680,400 L780,400" marker-end="url(#runtimeArrow)"/>
<rect class="band" x="765" y="268" width="300" height="51" rx="10"/>
<text x="915" y="300" class="eyebrow" text-anchor="middle">ONE GROUP · ONE AGENT THREAD</text>
<rect class="card" x="30" y="530" width="270" height="110" rx="12"/>
<text x="48" y="560" class="label" text-anchor="start">Server-owned services</text>
<text x="48" y="586" class="small" text-anchor="start">Versioned registry and broadcasts</text>
<text x="48" y="609" class="small" text-anchor="start">Independent service agent groups</text>
<rect class="card" x="405" y="530" width="275" height="110" rx="12"/>
<text x="423" y="560" class="label" text-anchor="start">Capture I/O helpers</text>
<text x="423" y="586" class="small" text-anchor="start">Open and close physical resources</text>
<text x="423" y="609" class="small" text-anchor="start">Return identity-bound completions</text>
<rect class="card" x="780" y="530" width="270" height="110" rx="12"/>
<text x="798" y="560" class="label" text-anchor="start">Control audit</text>
<text x="798" y="586" class="small" text-anchor="start">Bounded history + export manifest</text>
<text x="798" y="609" class="small" text-anchor="start">Separate from business replay</text>
<path class="wire" d="M915,453 L915,530" marker-end="url(#runtimeArrow)"/>
<path class="wire" d="M780,460 L680,530" marker-end="url(#runtimeArrow)"/>
<path class="wire" d="M540,530 L540,453" marker-end="url(#runtimeArrow)"/>
</svg>
