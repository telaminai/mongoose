<svg xmlns="http://www.w3.org/2000/svg" class="mg-architecture" viewBox="0 0 1080 780" role="img" aria-labelledby="shutdownTitle shutdownDesc">
<title id="shutdownTitle">One deadline, resumable shutdown</title><desc id="shutdownDesc">Helpers may outlive the caller. Incomplete shutdown must remain visible.</desc>
<style>
.mg-architecture { --bg:#f5f8fc; --panel:#ffffff; --text:#17283d; --muted:#526379; --line:#64748b; --border:#ced8e5; --accent:#165cba; --soft:#e8f0fc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); border:1px solid var(--border); border-radius:16px; width:100%; height:auto; }
@media(prefers-color-scheme:dark){.mg-architecture {--bg:#152032;--panel:#1c2c42;--text:#edf4ff;--muted:#b6c7dc;--line:#91aac8;--border:#3c516e;--accent:#8abaff;--soft:#253d5d}}
[data-md-color-scheme="default"] .mg-architecture {--bg:#f5f8fc;--panel:#fff;--text:#17283d;--muted:#526379;--line:#64748b;--border:#ced8e5;--accent:#165cba;--soft:#e8f0fc}
[data-md-color-scheme="slate"] .mg-architecture {--bg:#152032;--panel:#1c2c42;--text:#edf4ff;--muted:#b6c7dc;--line:#91aac8;--border:#3c516e;--accent:#8abaff;--soft:#253d5d}
.mg-architecture text{fill:var(--text);font-size:16px}.mg-architecture .heading{font-size:25px;font-weight:650}.mg-architecture .label{font-size:17px;font-weight:650}.mg-architecture .small{font-size:14px;fill:var(--muted)}.mg-architecture .eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;fill:var(--accent)}.mg-architecture .card{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.mg-architecture .band{fill:var(--soft);stroke:var(--border)}.mg-architecture .wire{fill:none;stroke:var(--line);stroke-width:1.7}.mg-architecture .life{stroke:var(--border);stroke-width:1.4;stroke-dasharray:5 6}
</style>
<defs><marker id="shutdownArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="var(--line)"/></marker></defs>
<text x="32" y="35" class="eyebrow" text-anchor="start">MONGOOSE / RUNTIME ARCHITECTURE</text>
<text x="32" y="72" class="heading" text-anchor="start">One deadline, resumable shutdown</text>
<text x="32" y="101" class="small" text-anchor="start">Helpers may outlive the caller. Incomplete shutdown must remain visible.</text>
<rect class="card" x="32" y="135" width="665" height="86" rx="12"/>
<text x="50" y="165" class="label" text-anchor="start">1  Fence admission and startup</text>
<text x="50" y="191" class="small" text-anchor="start">Snapshot groups; wait only for the remaining deadline.</text>
<path class="wire" d="M365,221 L365,247" marker-end="url(#shutdownArrow)"/>
<rect class="card" x="32" y="247" width="665" height="86" rx="12"/>
<text x="50" y="277" class="label" text-anchor="start">2  Stop feeds</text>
<text x="50" y="303" class="small" text-anchor="start">Close feed-only groups; remove feeds from mixed service groups.</text>
<path class="wire" d="M365,333 L365,359" marker-end="url(#shutdownArrow)"/>
<rect class="card" x="32" y="359" width="665" height="86" rx="12"/>
<text x="50" y="389" class="label" text-anchor="start">3  Drain queued inputs</text>
<text x="50" y="415" class="small" text-anchor="start">Bound the drain; report and release remaining backlog on expiry.</text>
<path class="wire" d="M365,445 L365,471" marker-end="url(#shutdownArrow)"/>
<rect class="card" x="32" y="471" width="665" height="86" rx="12"/>
<text x="50" y="501" class="label" text-anchor="start">4  Close processor groups</text>
<text x="50" y="527" class="small" text-anchor="start">Join tracked helpers; preserve non-feed dependencies while groups run.</text>
<path class="wire" d="M365,557 L365,583" marker-end="url(#shutdownArrow)"/>
<rect class="card" x="32" y="583" width="665" height="86" rx="12"/>
<text x="50" y="613" class="label" text-anchor="start">5  Close remaining services</text>
<text x="50" y="639" class="small" text-anchor="start">Join service groups, stop owned services, account for capture cleanup.</text>
<rect class="band" x="745" y="170" width="300" height="150" rx="12"/>
<text x="763" y="200" class="label" text-anchor="start">Deadline expires</text>
<text x="763" y="226" class="small" text-anchor="start">Return incomplete StopResult</text>
<text x="763" y="249" class="small" text-anchor="start">Keep STOPPING</text>
<text x="763" y="272" class="small" text-anchor="start">Report unfinished ownership</text>
<rect class="band" x="745" y="390" width="300" height="150" rx="12"/>
<text x="763" y="420" class="label" text-anchor="start">Call shutdown again</text>
<text x="763" y="446" class="small" text-anchor="start">Rejoin existing helpers</text>
<text x="763" y="469" class="small" text-anchor="start">Resume unfinished phases</text>
<text x="763" y="492" class="small" text-anchor="start">Do not claim stuck work stopped</text>
<path class="wire" d="M895,320 L895,390" marker-end="url(#shutdownArrow)"/>
<text x="32" y="744" class="small" text-anchor="start">STOPPED requires completed shutdown; it is not another name for “the caller stopped waiting”.</text>
</svg>
